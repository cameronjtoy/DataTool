[package]
name = "datatool-core"
description = "Core library for DataTool: formulas, dataset loading and profiling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
polars = { version = "0.55", default-features = false, features = [
    "fmt",
    "lazy",
    "csv",
    "parquet",
    "json",
    "dtype-date",
    "dtype-datetime",
    "dtype-categorical",
    "strings",
    "temporal",
    "is_unique",
    "unique_counts",
    "rank",
    "cov",
    "abs",
    "round_series",
] }
calamine = { version = "0.36", features = ["dates"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
