[package]
name = "datatool-cli"
description = "Command-line interface for DataTool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "datatool"
path = "src/main.rs"

[dependencies]
datatool-core.workspace = true
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
